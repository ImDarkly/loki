name: Sync closed issue to Notion

on:
  issues:
    types: [closed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update matching Notion task to Done
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -s -X POST https://api.notion.com/v1/databases/$NOTION_DATABASE_ID/query \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"filter\":{\"property\":\"Task\",\"title\":{\"contains\":\"(#$ISSUE_NUMBER)\"}}}" \
            -o response.json

          PAGE_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('response.json')).results[0]?.id || '')")

          if [ -z "$PAGE_ID" ]; then
            echo "No matching Notion task found for issue #$ISSUE_NUMBER"
            exit 0
          fi

          curl -s -X PATCH https://api.notion.com/v1/pages/$PAGE_ID \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties":{"Status":{"status":{"name":"Done"}}}}'

          echo "Marked Notion task for issue #$ISSUE_NUMBER as Done"